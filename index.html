<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>3D PWA Game</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div class="title">3D PWA Game Starter</div>
      <div class="help">WASD / arrows · mobile D-pad</div>
      <button id="installButton" hidden>Install game</button>
    </div>

    <div id="touchControls" aria-label="Touch controls">
      <button data-key="ArrowUp" class="up">▲</button>
      <button data-key="ArrowLeft" class="left">◀</button>
      <button data-key="ArrowDown" class="down">▼</button>
      <button data-key="ArrowRight" class="right">▶</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
